defaults:
  - _self_
  - env: shadow_hand
  - override hydra/launcher: local
  - override hydra/output: local

hydra:
  job:
    chdir: True

model: qwen3-max  # LLM model (other options are gpt-4, gpt-4-0613, gpt-3.5-turbo-16k-0613)
model_vlm: null  # VLM used for video-based evaluation. "mock" generates random scores.
temperature: 1.0
top_p: 0.95
suffix: Qwen  # suffix for generated files (indicates LLM model)

# Top-level knobs for hydra overrides (population_size and generations derive from these)
sample: 4        # population_size
iteration: 5     # generations

max_iterations: 3000 # RL Policy training iterations
gpu_id: "4,5,6,7"
capture_video: True

use_wandb: False
wandb_username: ""
wandb_project: ""

evolution:
  generations: ${iteration}
  population_size: ${sample}
  elite_fraction: 0.5
  tournament_size: 2

video:
  rollout_len: 300
  headless: True          
  force_render: False
  target_fps: 10         # target fps for VLM frame sampling

vlm:
  max_retries: 3


