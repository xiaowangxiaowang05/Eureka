hydra:
  output_subdir: .hydra
  run:
    dir: ./policy-${now:%Y-%m-%d}_${now:%H-%M-%S}
  launcher:
    cpus_per_task: 20
    gpus_per_node: 2
    tasks_per_node: 1
    timeout_min: 600
    mem_gb: 256
    name: ${hydra.job.name}
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.LocalLauncher
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    root:
      level: ERROR
    disable_existing_loggers: true
  env: {}
  mode: RUN
  searchpath: []
  sweep:
    dir: ???
    subdir: ???
  callbacks: {}
  overrides:
    hydra:
    - hydra/output=subprocess
    - hydra.mode=RUN
    task:
    - task=ShadowHandQwen
    - checkpoint=/ssd/home/wangyuhang/python/Eureka/eureka/outputs/eureka/2025-12-13_20-25-50/policy-2025-12-14_00-51-12/runs/ShadowHandQwen-2025-12-14_00-51-13/nn/last_ShadowHandQwen_ep_3000.pth
    - test=True
    - capture_video=True
    - capture_video_freq=300
    - capture_video_len=300
    - headless=False
    - force_render=True
    - task.env.enableCameraSensors=True
    - multi_gpu=False
    - graphics_device_id=0
    - sim_device=cuda:0
    - rl_device=cuda:0
    - pipeline=gpu
    - num_envs=1
    - max_iterations=0
    - seed=6
    - train.params.config.player.games_num=1
    - task.env.episodeLength=300
  job:
    name: train
    chdir: null
    override_dirname: capture_video=True,capture_video_freq=300,capture_video_len=300,checkpoint=/ssd/home/wangyuhang/python/Eureka/eureka/outputs/eureka/2025-12-13_20-25-50/policy-2025-12-14_00-51-12/runs/ShadowHandQwen-2025-12-14_00-51-13/nn/last_ShadowHandQwen_ep_3000.pth,force_render=True,graphics_device_id=0,headless=False,max_iterations=0,multi_gpu=False,num_envs=1,pipeline=gpu,rl_device=cuda:0,seed=6,sim_device=cuda:0,task.env.enableCameraSensors=True,task.env.episodeLength=300,task=ShadowHandQwen,test=True,train.params.config.player.games_num=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /ssd/home/wangyuhang/python/Eureka/eureka/outputs/eureka/2025-12-13_20-25-50
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /ssd/home/wangyuhang/python/Eureka/isaacgymenvs/isaacgymenvs/cfg
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /ssd/home/wangyuhang/python/Eureka/eureka/outputs/eureka/2025-12-13_20-25-50/policy-2025-12-14_01-43-50
    choices:
      task: ShadowHandQwen
      train: ShadowHandQwenPPO
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: disabled
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: local
      hydra/output: subprocess
  verbose: false
